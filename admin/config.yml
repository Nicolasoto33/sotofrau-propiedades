backend:
  name: github
  repo: Nicolasoto33/sotofrau-propiedades
  branch: contenido-borradores
  squash_merges: true
  commit_messages:
    create: 'Crear {{collection}} “{{slug}}”'
    update: 'Actualizar {{collection}} “{{slug}}”'
    delete: 'Eliminar {{collection}} “{{slug}}”'
    uploadMedia: 'Subir imagen “{{path}}”'
    deleteMedia: 'Eliminar imagen “{{path}}”'

publish_mode: editorial_workflow

site_url: https://sotofraupropiedades.cl
display_url: https://sotofraupropiedades.cl

locale: es

logo:
  src: https://sotofraupropiedades.cl/logo-sotofrau.png
  show_in_header: true

show_preview_links: true
search: true

# Optimización automática SOLO para imágenes nuevas subidas desde el panel.
# Mantiene el encuadre original: no se recorta la fotografía.
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 86
  strip_metadata: true
  width: 2000
  height: null

# =====================================================
# ARCHIVOS MULTIMEDIA GLOBALES
# Decap requiere media_folder a nivel global.
# Las propiedades sobrescriben esta ruta por ID.
# =====================================================

media_folder: "propiedades"
public_folder: "/propiedades"

collections:

  # =====================================================
  # PROPIEDADES
  # =====================================================

  - name: "propiedades"
    label: "🏠 Propiedades"
    label_singular: "Propiedad"

    description: "Crea, revisa y administra las propiedades de Sotofrau. Los cambios se guardan primero en el flujo editorial antes de llegar al sitio público."

    folder: "content/propiedades"

    # Las fotografías nuevas se organizan por ID.
    # Ejemplo: propiedades/35/imagen.jpg
    media_folder: "/propiedades/{{id}}"
    public_folder: "/propiedades/{{id}}"

    create: true
    delete: false

    extension: "json"
    format: "json"

    identifier_field: "titulo"

    slug: "{{id}}"

    preview_path: "propiedad/{{id}}/"

    summary: "ID {{id}} · {{operacion}} · {{estadoTexto}} · {{titulo}}"

    sortable_fields:
      - "commit_date"
      - "id"
      - "titulo"
      - "operacion"
      - "estado"

    view_filters:

      - label: "Disponibles"
        field: "estado"
        pattern: "disponible"

      - label: "Arrendadas / Gestionadas"
        field: "estado"
        pattern: "gestionada"

      - label: "Vendidas"
        field: "estado"
        pattern: "vendida"

      - label: "Arriendos"
        field: "operacion"
        pattern: "Arriendo"

      - label: "Ventas"
        field: "operacion"
        pattern: "Venta"

    view_groups:

      - label: "Agrupar por operación"
        field: "operacion"

      - label: "Agrupar por estado"
        field: "estado"

      - label: "Agrupar por visibilidad"
        field: "publicada"

    fields:

      # =====================================================
      # IDENTIFICACIÓN
      # =====================================================

      - label: "🔑 ID único"
        name: "id"
        widget: "number"
        value_type: "int"
        min: 1
        step: 1
        hint: "**No repitas un ID existente.** Este número identifica la propiedad y forma parte de su URL."

      - label: "📝 Título de la propiedad"
        name: "titulo"
        widget: "string"
        pattern: ['.{12,}', "Escribe un título descriptivo de al menos 12 caracteres."]
        hint: "Debe describir claramente qué se ofrece y dónde. Ejemplo: **Departamento en venta frente al mar en San Martín, Viña del Mar**."

      - label: "🌐 Visible en la página web"
        name: "publicada"
        widget: "boolean"
        default: true
        hint: "Actívalo solo cuando la ficha esté lista. Puedes desactivarlo para ocultar una propiedad sin eliminarla."

      # =====================================================
      # OPERACIÓN Y ESTADO
      # =====================================================

      - label: "Operación"
        name: "operacion"
        widget: "select"
        options:
          - "Arriendo"
          - "Venta"
        hint: "Indica si la propiedad corresponde a arriendo o venta."

      - label: "Estado"
        name: "estado"
        widget: "select"
        options:

          - label: "Disponible"
            value: "disponible"

          - label: "Arrendada / Gestionada"
            value: "gestionada"

          - label: "Vendida"
            value: "vendida"

        hint: "Usa **Disponible** mientras se ofrece. En un arriendo cerrado usa **Arrendada / Gestionada**; en una venta cerrada usa **Vendida**."

      - label: "Texto visible del estado"
        name: "estadoTexto"
        widget: "select"
        options:
          - "Disponible"
          - "Arrendada"
          - "Vendida"
        default: "Disponible"
        hint: "Debe coincidir con el estado anterior: Disponible, Arrendada o Vendida."

      # =====================================================
      # TIPO DE PROPIEDAD
      # =====================================================

      - label: "Tipo de propiedad"
        name: "tipoPropiedad"
        widget: "select"
        required: false
        options:
          - "Departamento"
          - "Casa"
          - "Parcela"
          - "Terreno"
          - "Oficina"
          - "Local comercial"
          - "Habitación"
          - "Otro"
        hint: "Selecciona el tipo de inmueble."

      # =====================================================
      # UBICACIÓN
      # =====================================================

      - label: "📍 Dirección"
        name: "direccion"
        widget: "string"
        required: false
        hint: "Calle, número, edificio o referencia que quieras mostrar públicamente."

      - label: "🗺️ Ubicación / sector"
        name: "ubicacion"
        widget: "string"
        pattern: ['.{3,}', "Indica una ubicación o sector válido."]
        hint: "Usa un formato consistente. Ejemplo: **Costa de Montemar · Concón**."

      # =====================================================
      # VALORES
      # =====================================================

      - label: "💰 Precio"
        name: "precio"
        widget: "string"
        pattern: ['.*(UF|uf|CLP|clp|[$]).*', "Indica siempre la moneda: $, CLP o UF."]
        hint: "Escribe siempre la moneda. Ejemplos: **$550.000 mensuales** o **4.500 UF**."

      - label: "Gastos comunes"
        name: "gastosComunes"
        widget: "string"
        required: false
        hint: "Ejemplo: $100.000 aprox., GGCC incluidos o No aplica."

      - label: "Total mensual"
        name: "totalMensual"
        widget: "string"
        required: false
        hint: "Útil cuando deseas mostrar canon más gastos comunes."

      - label: "Precio alternativo"
        name: "precioAlternativo"
        widget: "string"
        required: false
        hint: "Úsalo cuando exista una segunda alternativa de precio. Ejemplo: $650.000 con estacionamiento + bodega."

      - label: "Precio con bodega"
        name: "precioBodega"
        widget: "string"
        required: false
        hint: "Úsalo cuando exista un valor especial asociado a la inclusión de bodega. Ejemplo: 4.100 UF con bodega."

      # =====================================================
      # CARACTERÍSTICAS PRINCIPALES
      # =====================================================

      - label: "Superficie"
        name: "superficie"
        widget: "string"
        required: false
        hint: "Escribe primero la superficie principal. Ejemplo: **76 m² construidos. Terraza de 4,8 m².**"

      - label: "Dormitorios"
        name: "dormitorios"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "Baños"
        name: "banos"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "Estacionamientos"
        name: "estacionamientos"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "Bodegas"
        name: "bodegas"
        widget: "number"
        value_type: "int"
        min: 0
        required: false

      - label: "Piso"
        name: "piso"
        widget: "string"
        required: false
        hint: "Ejemplo: Piso 3, 16° piso o dejar vacío."

      - label: "Orientación"
        name: "orientacion"
        widget: "string"
        required: false
        hint: "Ejemplo: Norte, Poniente o Nororiente."

      - label: "Mascotas"
        name: "mascotas"
        widget: "select"
        required: false
        options:
          - "Permitidas"
          - "No permitidas"
          - "Mascotas pequeñas"
          - "Consultar"

      # =====================================================
      # IMAGEN PRINCIPAL
      # =====================================================

      - label: "⭐ Imagen principal"
        name: "imagen"
        widget: "image"
        required: false
        choose_url: false
        media_library:
          config:
            max_file_size: 20000000
        hint: "**Muy importante:** esta fotografía representa la propiedad en las tarjetas y se utiliza para la vista previa al compartir por WhatsApp y redes."

      # =====================================================
      # GALERÍA DE FOTOGRAFÍAS
      # =====================================================

      - label: "📸 Galería de fotografías"
        name: "fotos"
        widget: "list"
        required: false
        collapsed: true
        minimize_collapsed: true
        summary: "{{fields.foto}}"
        hint: "Agrega las fotografías en el orden en que quieres que el cliente las recorra."

        field:
          label: "Foto"
          name: "foto"
          widget: "image"
          choose_url: false
          media_library:
            config:
              max_file_size: 20000000

      # =====================================================
      # CARACTERÍSTICAS VISIBLES
      # =====================================================

      - label: "Características"
        name: "caracteristicas"
        widget: "list"
        collapsed: true
        minimize_collapsed: true
        required: false
        hint: "Ejemplo: 🛏 3 dormitorios, 🚿 2 baños, 📐 80 m²."

        field:
          label: "Característica"
          name: "caracteristica"
          widget: "string"

      # =====================================================
      # DESCRIPCIÓN
      # =====================================================

      - label: "Descripción"
        name: "descripcion"
        widget: "list"
        collapsed: true
        minimize_collapsed: true
        required: false
        hint: "Cada elemento corresponde a un párrafo de la descripción."

        field:
          label: "Párrafo"
          name: "parrafo"
          widget: "text"

      # =====================================================
      # INFORMACIÓN IMPORTANTE
      # =====================================================

      - label: "Información importante"
        name: "informacionImportante"
        widget: "list"
        collapsed: true
        minimize_collapsed: true
        required: false
        hint: "Condiciones, valores, restricciones o elementos destacados."

        field:
          label: "Punto importante"
          name: "punto"
          widget: "string"

      # =====================================================
      # ÁREAS COMUNES
      # =====================================================

      - label: "Áreas comunes"
        name: "areasComunes"
        widget: "list"
        collapsed: true
        minimize_collapsed: true
        required: false
        hint: "Ejemplo: 🏊 Piscina, 🔥 Quinchos, 💪 Gimnasio."

        field:
          label: "Área común"
          name: "area"
          widget: "string"

      # =====================================================
      # CONECTIVIDAD
      # =====================================================

      - label: "Conectividad"
        name: "conectividad"
        widget: "list"
        collapsed: true
        minimize_collapsed: true
        required: false
        hint: "Locomoción, servicios, universidades, playas, avenidas u otros puntos cercanos."

        field:
          label: "Punto de conectividad"
          name: "punto"
          widget: "string"

      # =====================================================
      # REQUISITOS DE ARRIENDO
      # =====================================================

      - label: "Requisitos de arriendo"
        name: "requisitos"
        widget: "list"
        collapsed: true
        minimize_collapsed: true
        required: false
        hint: "Déjalo vacío en publicaciones de venta si no corresponde."

        field:
          label: "Requisito"
          name: "requisito"
          widget: "text"

      # =====================================================
      # WHATSAPP
      # =====================================================

      - label: "💬 Mensaje de WhatsApp"
        name: "whatsapp"
        widget: "text"
        required: false
        hint: "Mensaje prellenado que recibirá el interesado al tocar **Consultar por WhatsApp**. Incluye el tipo de propiedad, sector, precio y una invitación a coordinar visita."
